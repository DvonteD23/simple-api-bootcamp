<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width", initial-scale="1.0">
    <link rel="stylesheet" href="css\style.css">
    <title>Population Lookback</title>
</head>
<body>
    <header>
        <h1>ReDeaux</h1>
        <navbar class="navbar">
            <ul class="navlist">
                <li class="links"><a href="">Login</a></li>
                <li class="links"><a href="">Sign Up</a></li>
                <li class="links"><a href="">FAQ</a></li>
                <li class="links"><a href="">Contact US</a></li>
            </ul>
            </navbar>
    </header>
    <div class="container">
    <input type="text" id="searchCountry" placeholder="Enter Country"></input>
    <input type="text" id="searchYear" placeholder="Enter Year"></input>
    <button id="search">Search</button>
        <h2 id="country"></h2>
        <h3 id="year"></h3>
        <h4 id="population"></h4>
    </div>
    <div class="container">
    <p>ReDeaux is a API designed to provide users with global population data. Simply enter a country and year and the returned result is the total population. Users can search for any year from 1961-2018. </p>
    </div>
    <script src="main.js"></script>
</body>
</html>
